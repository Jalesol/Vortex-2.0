<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vortex AI — Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="chat.css" />
</head>
<body>

  <div class="tela-carregando" id="carregando">
    <p>Verificando sua sessão...</p>
  </div>

  <div class="app" id="app" hidden>

    <aside class="sidebar">

      <div class="sidebar-top">
        <div class="brand">
          <span class="brand-v">V</span>
          <span class="brand-name">VORTEX</span>
        </div>
        <p class="brand-tag">Sua IA, sempre com você.</p>

        <button class="btn-novo-chat" id="novo-chat" type="button">
          <span class="icone">+</span> <span>Novo chat</span>
        </button>

        <div class="historico-titulo">
          <span class="icone-relogio">&#9719;</span> Histórico de conversas
        </div>

        <ul class="lista-conversas" id="lista-conversas"></ul>
      </div>

      <div class="sidebar-bottom">
        <button class="btn-lateral" id="alternar-tema" type="button">
          <span class="icone">&#9788;</span> <span>Alternar tema</span>
        </button>
        <button class="btn-lateral" id="sair" type="button">
          <span class="icone">&#9211;</span> <span>Sair</span>
        </button>
      </div>

    </aside>

    <main class="conteudo">

      <header class="chat-header">
        <div class="chat-header-info">
          <span class="avatar-v">V</span>
          <div>
            <h2>Vortex IA</h2>
            <span class="status"><i class="dot"></i> Online</span>
          </div>
        </div>
      </header>

      <section class="mensagens" id="mensagens">
        <div class="boas-vindas" id="boas-vindas">
          <h1 id="saudacao">Olá!</h1>
          <p>Como posso te ajudar hoje?</p>
        </div>
      </section>

      <form class="chat-form" id="form-chat">
        <input
          type="text"
          id="mensagem"
          class="campo-mensagem"
          placeholder="Digite sua mensagem..."
          autocomplete="off"
        />
        <button type="submit" class="btn-enviar" title="Enviar">&#10148;</button>
      </form>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="chat.js"></script>
</body>
</html>
